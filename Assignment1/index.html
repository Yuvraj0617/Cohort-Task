<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="left-panel">
                <img class="logo" src="assets/logo.png" alt="Pokemon">

                <div class="copy">
                    <p class="eyebrow">Pokemon Gen I</p>
                    <h1>Pikachu</h1>
                    <p class="description">
                        Pikachu is an Electric-type Pokemon introduced <br> in Generation I. Pikachu are small, chubby,<br> and incredibly cute mouse-like Pokemon.<br>
                        They are almost completely covered by<br>
                        yellow fur.
                    </p>

                    <div class="count">
                        <span></span>
                        <strong>01 / 08</strong>
                    </div>
                </div>

                <img class="pokeball-image" src="./assets/pokeball-image.webp" alt="Pokeball">
            </div>

            <div class="right-panel">
                <button class="menu" aria-label="Open menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <img class="pikachu" src="./assets/pikachu.png" alt="Pikachu">

                <div class="pagination" aria-label="Slide pagination">
                    <span class="active"></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
