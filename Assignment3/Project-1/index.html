<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Art Work</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="gallery-page">
        <header class="top-bar">
            <h1>Explore Art Work</h1>
            <a href="#" class="see-all">See All</a>
        </header>

        <section class="art-grid" aria-label="Explore art work gallery">
            <article class="art-card">
                <img src="Assets/image_1.jpg" alt="Monocular artwork">
                <div class="art-info">
                    <h2>Monocular</h2>
                    <span>54.8k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_2.jpg" alt="Horns Mask artwork">
                <div class="art-info">
                    <h2>Horns Mask</h2>
                    <span>32.4k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_3.jpg" alt="Light Moon artwork">
                <div class="art-info">
                    <h2>Light Moon</h2>
                    <span>86.6k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_4.jpg" alt="Skull Wire artwork">
                <div class="art-info">
                    <h2>Skull Wire</h2>
                    <span>78.9k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_5.jpg" alt="Spiderman artwork">
                <div class="art-info">
                    <h2>Spiderman</h2>
                    <span>24.8k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_6.jpg" alt="DeadPool artwork">
                <div class="art-info">
                    <h2>DeadPool</h2>
                    <span>59.7k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_7.jpg" alt="White Eye artwork">
                <div class="art-info">
                    <h2>White Eye</h2>
                    <span>45.7k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>

            <article class="art-card">
                <img src="Assets/image_8.jpg" alt="Plastic Spinal artwork">
                <div class="art-info">
                    <h2>Plastic Spinal</h2>
                    <span>98.6k <i class="ri-heart-line"></i></span>
                </div>
                <button>Place Bid</button>
            </article>
        </section>
    </main>
</body>
</html>
